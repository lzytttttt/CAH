services:
  cognitive-atrium:
    build: .
    image: cognitive-atrium:0.1.0
    container_name: cognitive-atrium
    restart: unless-stopped
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      CA_HOST: 0.0.0.0
      CA_PORT: "4310"
      CA_DATA_DIR: /data
      # Live model connection (never commit real secrets; use an .env file next to this compose file)
      CA_OPENAI_BASE_URL: ${CA_OPENAI_BASE_URL:-https://api.openai.com/v1}
      CA_OPENAI_MODEL: ${CA_OPENAI_MODEL:-}
      CA_OPENAI_API_KEY: ${CA_OPENAI_API_KEY:-}
      CA_SEED_DEMO: "true"
      CA_ALLOWED_ORIGINS: "http://127.0.0.1:4310,http://localhost:4310"
      # Access a model server on the Docker host:
      # CA_ALLOWED_PROVIDER_HOSTS: "host.docker.internal:11434"
    volumes:
      - cognitive-atrium-data:/data
    # For a host-local model server (Ollama/vLLM), uncomment:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  cognitive-atrium-data:
